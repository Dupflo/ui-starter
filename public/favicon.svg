<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" baseProfile="tiny" version="1.2" viewBox="0 0 220 220">
  <!-- favicon / app icon (tab, bookmarks, PWA install prompt). Neutral geometric
       mark. Hex values are the resolved @theme tokens (pine / lime / paper, see
       app/globals.css) — a standalone SVG can't consume Tailwind token classes,
       so re-theming means editing this file alongside the @theme block. -->
  <rect width="220" height="220" rx="48" fill="#1E2132"/>
  <path d="M110 50 L170 110 L110 170 L50 110 Z" fill="#818CF8"/>
  <path d="M110 80 L140 110 L110 140 L80 110 Z" fill="#F9F9FB"/>
</svg>
